<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; background: #1a1a2e; color: #fff; }
  .container { max-width: 500px; margin: 0 auto; }
  h2 { font-size: 16px; color: #888; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 8px; }
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #16213e; border-radius: 6px; cursor: pointer; }
  .task-item:hover { background: #1f2b47; }
  .checkbox { width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: #4ade80; }
  .task-title { flex: 1; font-size: 13px; color: #e2e8f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-title.done { text-decoration: line-through; color: #64748b; }
  .priority { font-size: 14px; flex-shrink: 0; }

  .panel { background: #0f0f23; border-radius: 10px; border: 1px solid #2d2d4a; margin-bottom: 16px; overflow: hidden; }
  .panel-header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #2d2d4a; background: #16213e; }
  .panel-header span:first-child { font-size: 16px; }
  .panel-header span:nth-child(2) { font-size: 14px; font-weight: 500; }
  .panel-count { margin-left: auto; font-size: 12px; padding: 2px 8px; background: #2d2d4a; color: #888; border-radius: 10px; }
  .panel-body { padding: 12px; }

  .section { margin-bottom: 24px; }
  .label { font-size: 14px; color: #f59e0b; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="container">
  <h2>仪表盘 - 改完后效果预览</h2>

  <div class="section">
    <div class="label">📋 今日任务</div>
    <div class="panel">
      <div class="panel-header">
        <span>📋</span>
        <span>今日任务</span>
        <span class="panel-count">3</span>
      </div>
      <div class="panel-body">
        <div class="task-list">
          <div class="task-item">
            <input type="checkbox" class="checkbox">
            <div class="task-title">完成项目报告文档</div>
            <div class="priority">🔴</div>
          </div>
          <div class="task-item">
            <input type="checkbox" class="checkbox">
            <div class="task-title">复习英语单词 50 个</div>
            <div class="priority">🟠</div>
          </div>
          <div class="task-item">
            <input type="checkbox" class="checkbox">
            <div class="task-title">整理房间</div>
            <div class="priority">🟡</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="label" style="color: #ef4444;">⚠️ 逾期任务</div>
    <div class="panel" style="border-color: #ef4444; background: #1a0a0a;">
      <div class="panel-header" style="background: #2a0a0a;">
        <span>⚠️</span>
        <span>逾期任务</span>
        <span class="panel-count" style="background: #ef4444; color: #fff;">2</span>
      </div>
      <div class="panel-body">
        <div class="task-list">
          <div class="task-item">
            <input type="checkbox" class="checkbox">
            <div class="task-title">提交上周周报</div>
            <div class="priority">🔴</div>
          </div>
          <div class="task-item">
            <input type="checkbox" class="checkbox">
            <div class="task-title">回复邮件</div>
            <div class="priority">🟠</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
